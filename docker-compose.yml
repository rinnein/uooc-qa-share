services:
  app:
    image: ghcr.io/rinnein/uooc-qa-share:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4321}:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-uooc_qa_share}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change-me-to-a-random-secret-in-production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:4321}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - BILI_SIGN_CLIENT_ID=${BILI_SIGN_CLIENT_ID:-}
      - BILI_SIGN_CLIENT_SECRET=${BILI_SIGN_CLIENT_SECRET:-}
      - BILI_SIGN_AUTHORIZATION_URL=${BILI_SIGN_AUTHORIZATION_URL:-https://bili-sign.rinne.in/oauth/authorize}
      - BILI_SIGN_TOKEN_URL=${BILI_SIGN_TOKEN_URL:-https://bili-sign.rinne.in/oauth/token}
      - BILI_SIGN_USERINFO_URL=${BILI_SIGN_USERINFO_URL:-https://bili-sign.rinne.in/oauth/userinfo}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://www.uooc.net.cn,tauri://localhost,https://tauri.localhost}
      - API_KEY_RATE_LIMIT_ENABLED=${API_KEY_RATE_LIMIT_ENABLED:-false}
      - API_KEY_RATE_LIMIT_TIME_WINDOW=${API_KEY_RATE_LIMIT_TIME_WINDOW:-60000}
      - API_KEY_RATE_LIMIT_MAX=${API_KEY_RATE_LIMIT_MAX:-100}
    env_file:
      - path: .env
        required: false
    networks:
      - uooc-qa-share
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks:
      - uooc-qa-share
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uooc_qa_share}
      BACKUP_DIR: /backups
      BACKUP_TABLES: ${BACKUP_TABLES:-courses task_groups questions answers}
      DAILY_TIME: ${BACKUP_DAILY_TIME:-02:00}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./drizzle:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/init-db.sh:/usr/local/bin/init-db.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        /usr/local/bin/backup.sh &
        exec docker-entrypoint.sh postgres
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uooc_qa_share}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  uooc-qa-share:
    name: uooc-qa-share
